name: Unsigned macOS Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies deterministically
        run: npm ci
      - name: Run release quality checks
        run: npm run test:ci && npm run lint && npm run audit
      - name: Build frontend and sandbox renderer
        run: npm run build
      - name: Check release structure
        run: node scripts/check-release.mjs
      - name: Check and test Rust
        working-directory: src-tauri
        run: cargo fmt --check && cargo test --locked && cargo clippy --all-targets -- --deny warnings
      - name: Build unsigned macOS app
        run: npm run tauri -- build --bundles app --ci --no-sign
      - name: Build unsigned macOS DMG without Finder automation
        run: bash scripts/build-unsigned-dmg.sh
      - name: Create SHA-256 checksums
        working-directory: src-tauri/target/release/bundle/dmg
        run: shasum -a 256 *.dmg > "$GITHUB_WORKSPACE/SHA256SUMS"
      - name: Verify downloaded-file checksum layout
        working-directory: src-tauri/target/release/bundle/dmg
        run: shasum -a 256 -c "$GITHUB_WORKSPACE/SHA256SUMS"
      - name: Attest unsigned release build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'src-tauri/target/release/bundle/dmg/*.dmg'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 屿阅 ${{ github.ref_name }}
          body_path: docs/release/UNSIGNED_MACOS.md
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
