name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies deterministically
        run: npm ci
      - name: Execute frontend tests
        run: npm run test:ci
      - name: Lint frontend and build configuration
        run: npm run lint
      - name: Audit dependencies
        run: npm run audit
      - name: Build frontend and renderer assets
        run: npm run build
      - name: Check release structure
        run: node scripts/check-release.mjs
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Run Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- --deny warnings
